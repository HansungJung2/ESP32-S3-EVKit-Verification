; PlatformIO 프로젝트 설정 파일
; ESP32-S3-WROOM-1 (N16R8) - 16MB Flash, 8MB PSRAM

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 시리얼 포트 (COM6로 고정, 필요시 변경)
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200

; ESP32-S3 USB 모드 설정
; N16R8: 16MB Flash, 8MB OPI PSRAM
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

; PSRAM 활성화 (8MB OPI PSRAM)
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; FastLED 라이브러리 (WS2812B RGB LED GPIO48)
lib_deps =
    fastled/FastLED @ ^3.9.3

; USB CDC (내장 USB 사용시) or UART0 (CH343 사용)
; 현재 CH343(COM6)이므로 UART 모드 사용


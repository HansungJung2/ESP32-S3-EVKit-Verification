; PlatformIO 프로젝트 설정 파일
; ESP32-S3-WROOM-1 (N16R8) - 16MB Flash, 8MB Octal(OPI) PSRAM

[platformio]
; 한글 및 특수문자 경로로 인한 GCC ld.exe 빌드 맵 파일 생성 오류 방지를 위해 빌드 경로 지정
build_dir = D:/.pio-build/ESP32-S3-EVKit-Verification

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 시리얼 포트 설정 (현재 PC: CH343 COM3 포트 인식)
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200

; N16R8: 16MB Flash (Quad), 8MB PSRAM (Octal/OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB

; PSRAM 하드웨어 활성화 플래그
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; 의존성 라이브러리
lib_deps =
    fastled/FastLED @ ^3.9.3
